[project]
name = "jira-reporter"
version = "0.1.0"
description = "A CLI tool to fetch and report Jira work logs with OAuth authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "jira>=3.8.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
jira-reporter = "jira_reporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_reporter"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
